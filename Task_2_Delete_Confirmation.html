<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Confirmation</title>
    <script>
        function bodyload()
        {
            isConfirm = confirm("Do you want to delete this file?");
            if(isConfirm)
                document.querySelector("p").textContent = "File deleted successfully";
            else 
                document.querySelector("p").textContent = "File deletion cancelled";

        }
    </script>
</head>
<body onload="bodyload()">
    <p></p>
</body>
</html>
