<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+" crossorigin="anonymous"></script>
    <title>Student Feedback Preview</title>
    <script>
        function btnClick()
        {
            studentName = document.getElementById("studentName").value;
            feedback = document.getElementById("feedback").value;

            document.getElementById("feedbackPreview").textContent="Student: "+studentName+" | "+"Feedback: "+feedback;
        }
    </script>
</head>
<body class="bg-white m-5">
    <input type="text" id="studentName" placeholder="Enter Your Name" class="form-control m-5 bg-white w-25">
    <textarea id="feedback" placeholder="Enter Your FeedBack" class="form-control m-1 bg-white w-25 m-5"></textarea>
    <p id="feedbackPreview"></p>
    <button onclick="btnClick()" class="m-5 p-xl-1 bg-primary border-0 rounded">Preview Feedback</button>
</body>
</html>
